# Lighthouse on one EC2 host. With the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --no-build
#
# The images come from ECR (REGISTRY and TAG in .env), nothing but Caddy listens on the host,
# and Caddy serves each site over HTTPS with a certificate it obtains and renews itself.

x-backend-image: &backend-image ${REGISTRY}/lighthouse-backend:${TAG}

services:
  falkordb:
    ports: !reset []
    environment:
      # The append-only file of the base file, and a password: other containers reach it.
      REDIS_ARGS: --appendonly yes --appendfsync everysec --requirepass ${FALKORDB_PASSWORD}
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$FALKORDB_PASSWORD\" --no-auth-warning ping | grep -q PONG"]

  api:
    image: *backend-image
    ports: !reset []
  poller:
    image: *backend-image
  desk:
    image: *backend-image
  memory-api:
    image: *backend-image
    ports: !reset []

  screen:
    image: ${REGISTRY}/lighthouse-screen:${TAG}
    ports: !reset []
  memory-screen:
    image: ${REGISTRY}/lighthouse-memory-screen:${TAG}
    ports: !reset []
  docs:
    image: ${REGISTRY}/lighthouse-docs:${TAG}
    ports: !reset []

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST}
      MEMORY_HOST: ${MEMORY_HOST}
      DOCS_HOST: ${DOCS_HOST}
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [screen, memory-screen, docs, memory-api]

volumes:
  caddy_data:
  caddy_config:
