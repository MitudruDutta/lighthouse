[project]
name = "lighthouse-graph"
version = "0.1.0"
description = "Agent memory on FalkorDB for structured events: versioned by rule, no LLM on the write path"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mitudru Dutta", email = "mitudrudutta72@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.7.1",
]
keywords = [
    "agent memory",
    "falkordb",
    "graph",
    "knowledge graph",
    "temporal",
    "episodic memory",
    "multi-agent",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MitudruDutta/lighthouse"
Source = "https://github.com/MitudruDutta/lighthouse/tree/main/lighthouse-memory"
Issues = "https://github.com/MitudruDutta/lighthouse/issues"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lighthouse", "lighthouse.recall", "lighthouse.write"]

[tool.setuptools.package-data]
lighthouse = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
