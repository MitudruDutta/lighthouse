name: lighthouse

# Everything runs on this computer and listens on 127.0.0.1 only. ./setup.sh writes .env
# and starts it; `docker compose down` stops it and keeps the data.

x-backend: &backend
  image: lighthouse-backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    # Inside Compose the database is the service below, whatever .env says for the host.
    FALKORDB_HOST: falkordb
    FALKORDB_PORT: "6379"
  depends_on:
    falkordb:
      condition: service_healthy
  restart: unless-stopped

services:
  falkordb:
    # falkordb/falkordb:latest, pinned by digest (graph module version 60002)
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    # It crashed once under heavy test load (SIGSEGV): come back on its own.
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-26379}:6379"
      # FalkorDB Browser
      - "127.0.0.1:${FALKORDB_BROWSER_PORT:-23000}:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The read-only routes for the screen, and the desk's routes for people who sign in.
  api:
    <<: *backend
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      LIGHTHOUSE_MEMORY_CONTROL_DB: /data/memory-control.sqlite3
    volumes:
      - memory_control:/data
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Reads the ships due in Finland every five minutes and the ports of the world every hour,
  # and runs the Watcher, the Port Watcher, and the Reviewer after each read.
  poller:
    <<: *backend
    command: ["python", "-m", "app.poller", "world"]

  # The Desk agent: takes what the Watchers handed to the desk, every minute.
  desk:
    <<: *backend
    command: ["python", "-m", "app.desk", "world"]

  screen:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_LIGHTHOUSE_DOCS_URL: ${LIGHTHOUSE_DOCS_URL:-http://localhost:3002}
        NEXT_PUBLIC_LIGHTHOUSE_MEMORY_URL: ${MEMORY_SITE_URL:-http://localhost:3003}
    image: lighthouse-screen
    environment:
      LIGHTHOUSE_API: http://api:8100
      LIGHTHOUSE_APP_URL: ${LIGHTHOUSE_APP_URL:-http://localhost:3000}
      # Proves to the API that the browser address passed on with a sign-in comes from here.
      LIGHTHOUSE_PROXY_TOKEN: ${LIGHTHOUSE_PROXY_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SCREEN_PORT:-3000}:3000"
    restart: unless-stopped

  docs:
    build:
      context: docs-site
      args:
        NEXT_PUBLIC_MEMORY_CONSOLE_URL: ${MEMORY_SITE_URL:-http://localhost:3003}
    image: lighthouse-docs
    ports:
      - "127.0.0.1:${DOCS_PORT:-3002}:3002"
    restart: unless-stopped

  memory-api:
    <<: *backend
    command: ["uvicorn", "app.memory_main:app", "--host", "0.0.0.0", "--port", "8200"]
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      LIGHTHOUSE_MEMORY_CONTROL_DB: /data/memory-control.sqlite3
    volumes:
      - memory_control:/data
    ports:
      - "127.0.0.1:${MEMORY_API_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  memory-screen:
    build:
      context: memory-site
      args:
        NEXT_PUBLIC_MEMORY_DOCS_URL: ${LIGHTHOUSE_DOCS_URL:-http://localhost:3002}
    image: lighthouse-memory-screen
    environment:
      MEMORY_API: http://memory-api:8200
      MEMORY_SITE_URL: ${MEMORY_SITE_URL:-http://localhost:3003}
      MEMORY_PUBLIC_API: ${MEMORY_PUBLIC_API:-http://localhost:8200}
      LIGHTHOUSE_PROXY_TOKEN: ${LIGHTHOUSE_PROXY_TOKEN:-}
    ports:
      - "127.0.0.1:${MEMORY_SITE_PORT:-3003}:3003"
    depends_on:
      memory-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkordb_data:
  memory_control:
